worker_processes 1;

events { worker_connections 1024; }
http {
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen [::]:443 ssl;
        listen 443 ssl default;
        server_name __;

        ssl_certificate /etc/nginx/certs/apache-selfsigned.crt;
        ssl_certificate_key /etc/nginx/keys/apache-selfsigned.key;

        proxy_set_header X-Forwarded-For $proxy_protocol_addr; # To forward the original client's IP address
        proxy_set_header X-Forwarded-Proto $scheme; # to forward the  original protocol (HTTP or HTTPS)
        proxy_set_header Host $host; # to forward the original host requested by the client

       absolute_redirect off;

        location / {
            #Redirecting to the Front end on host machine 
                 #On linux 
            #proxy_pass         https://172.17.0.1:3000;
                 #On Mac 
            #proxy_pass         https://host.docker.internal:3000;
                #In docker
            proxy_pass https://frontend.openelis.org:3000;
            proxy_redirect     off;
        }

        # Rattrapages FHIR (OEToFhir, PatientToFhir, OrganizationToFhir) : traitement
        # SYNCHRONE qui dure de quelques minutes à plus d'une heure. Avec le délai
        # par défaut de nginx (60 s), le client recevait un 504 alors que le
        # traitement continuait côté OE. Suivi : /api/OpenELIS-Global/OEToFhir/info.
        location ~ ^/api/OpenELIS-Global/(OEToFhir|PatientToFhir|OrganizationToFhir)(/|$) {
            proxy_pass         https://oe.openelis.org:8443;
            proxy_redirect     off;
            proxy_read_timeout 7200s;
            proxy_send_timeout 7200s;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Host $server_name;
        }

        location /api/ {
            #Redirecting to OpenELIS server on host machine
                 #On linux
            #proxy_pass         https://172.17.0.1:8443/api/;
                 #On Mac
            #proxy_pass         https://host.docker.internal:8443/api/;
                #In docker
            proxy_pass         https://oe.openelis.org:8443/api/;
            proxy_redirect     off;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Host $server_name;
        }

        # ===== Mini-HIE (DEV) : gateway FHIR lecture, sécurisée par jeton =====
        # Pas d'IP allowlist en dev (pour ne pas se bloquer depuis Postman/curl).
        location = /fhir-gateway/auth {
            internal;
            proxy_pass              https://oe.openelis.org:8443/api/OpenELIS-Global/rest/fhir-gateway/auth;
            proxy_pass_request_body off;
            proxy_set_header        Content-Length "";
            proxy_set_header        Authorization $http_authorization;
            proxy_set_header        X-API-Key $http_x_api_key;
            # Phase C : méthode + URI d'origine pour la décision d'accès côté OE.
            proxy_set_header        X-Original-Method $request_method;
            proxy_set_header        X-Original-URI $request_uri;
        }

        # "/fhir" sans barre finale : forme des liens de pagination du HAPI
        # (/fhir?_getpages=...). Sans ce bloc, nginx répond 301 vers /fhir/.
        location = /fhir {
            auth_request        /fhir-gateway/auth;
            proxy_pass          http://fhir.openelis.org:8080/fhir;
            proxy_redirect      off;
            proxy_set_header    Host $host;
            proxy_set_header    X-Real-IP $remote_addr;
            proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Host $http_host;
            proxy_set_header    X-Forwarded-Proto $scheme;
        }

        location /fhir/ {
            auth_request        /fhir-gateway/auth;
            proxy_pass          http://fhir.openelis.org:8080/fhir/;
            proxy_redirect      off;
            proxy_set_header    Host $host;
            proxy_set_header    X-Real-IP $remote_addr;
            proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
            # hôte (port compris) et schéma publics, pour les liens de pagination du
            # HAPI (use_apache_address_strategy, sans server_address)
            proxy_set_header    X-Forwarded-Host $http_host;
            proxy_set_header    X-Forwarded-Proto $scheme;
        }

        # Réception PUSH d'ordres FHIR : proxifie vers OE (pas le HAPI), même jeton.
        location /fhir-in/ {
            auth_request        /fhir-gateway/auth;
            proxy_pass          https://oe.openelis.org:8443/api/OpenELIS-Global/rest/fhir-in/;
            proxy_redirect      off;
            proxy_set_header    Host $host;
            proxy_set_header    X-Real-IP $remote_addr;
            proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
