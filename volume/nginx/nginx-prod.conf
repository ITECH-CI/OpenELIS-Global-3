worker_processes 1;

events { worker_connections 1024; }
http {
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen [::]:443 ssl;
        listen 443 ssl default;
        server_name __;

        ssl_certificate /etc/nginx/certs/apache-selfsigned.crt;
        ssl_certificate_key /etc/nginx/keys/apache-selfsigned.key;

        proxy_set_header X-Forwarded-For $proxy_protocol_addr; # To forward the original client's IP address
        proxy_set_header X-Forwarded-Proto $scheme; # to forward the  original protocol (HTTP or HTTPS)
        proxy_set_header Host $host; # to forward the original host requested by the client

       absolute_redirect off;

        location / {
            proxy_pass http://frontend.openelis.org;
            proxy_redirect     off;
        }

        location /api/ {
            proxy_pass         https://oe.openelis.org:8443/api/;
            proxy_redirect     off;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Host $server_name;
        }

        # ============================================================
        # Mini-HIE : exposition LECTURE du serveur FHIR (HAPI) aux tiers.
        # Sécurité : IP allowlist + jeton dynamique validé par OE (auth_request).
        # Le HAPI n'est PAS publié en direct — seul ce proxy y donne accès.
        # ============================================================

        # Sous-requête d'auth interne : OE valide le jeton (200/401). "internal"
        # => non joignable directement de l'extérieur. On ne transmet pas le corps.
        location = /fhir-gateway/auth {
            internal;
            proxy_pass              https://oe.openelis.org:8443/api/OpenELIS-Global/rest/fhir-gateway/auth;
            proxy_pass_request_body off;
            proxy_set_header        Content-Length "";
            # Transmet le jeton présenté par le tiers à l'endpoint de validation.
            proxy_set_header        Authorization $http_authorization;
            proxy_set_header        X-API-Key $http_x_api_key;
            # Phase C : transmet la méthode et l'URI d'origine (celles de la requête
            # cliente, pas de la sous-requête) pour la décision d'accès (lecture seule,
            # ressource autorisée, audit) côté OE.
            proxy_set_header        X-Original-Method $request_method;
            proxy_set_header        X-Original-URI $request_uri;
        }

        location /fhir/ {
            # 1) Allowlist IP : décommenter/adapter par tiers autorisé, puis "deny all".
            #    (laisser ouvert tant qu'aucun tiers n'est déclaré casserait la sécurité,
            #     mais le jeton reste requis ci-dessous).
            # allow 10.0.0.0/8;
            # allow 192.168.0.0/16;
            # deny all;

            # 2) Jeton : valide par OE avant de proxifier. 401 si invalide/absent.
            auth_request        /fhir-gateway/auth;

            # 3) Proxy vers le HAPI interne en HTTP (réseau docker isolé ; le TLS
            #    externe est terminé par nginx). Le port 8443 du HAPI exige un
            #    certificat CLIENT (mTLS clientAuth=true) que nginx ne présente pas
            #    -> on passe par le connecteur HTTP 8080 interne. Le HAPI n'est de
            #    toute façon pas publié sur l'hôte (voir docker-compose.civ.yml).
            proxy_pass          http://fhir.openelis.org:8080/fhir/;
            proxy_redirect      off;
            proxy_set_header    Host $host;
            proxy_set_header    X-Real-IP $remote_addr;
            proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Réception PUSH d'ordres FHIR (Phase B) : proxifie vers OE (pas le HAPI),
        # même sécurité (jeton + IP allowlist ci-dessus à activer aussi ici).
        location /fhir-in/ {
            # allow 10.0.0.0/8; deny all;   # (mêmes tiers que /fhir/)
            auth_request        /fhir-gateway/auth;
            proxy_pass          https://oe.openelis.org:8443/api/OpenELIS-Global/rest/fhir-in/;
            proxy_redirect      off;
            proxy_set_header    Host $host;
            proxy_set_header    X-Real-IP $remote_addr;
            proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
