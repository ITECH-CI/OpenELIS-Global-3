# DNS local mono-site — résout oeglobal.local (et sous-domaines) vers l'IP du
# serveur, pour que les postes clients accèdent à https://oeglobal.local.
# Généré à l'installation (substitution [% server_ip %]).

# oeglobal.local et tout sous-domaine -> IP du serveur
address=/oeglobal.local/[% server_ip %]

# N'écouter que sur l'IP LAN du serveur (pas 127.0.0.53 de systemd-resolved)
listen-address=[% server_ip %]
bind-interfaces

# Ne répondre qu'aux requêtes locales (pas un resolver ouvert)
local-service
