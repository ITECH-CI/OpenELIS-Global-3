# DNS local mono-site — résout oeglobal.local (et sous-domaines) vers l'IP du
# serveur, et forwarde le reste vers le DNS amont (Internet des postes clients).
# Généré à l'installation (substitution [% server_ip %] / [% upstream_dns_line %]).

# Ne pas lire /etc/hosts du conteneur.
no-hosts

# oeglobal.local et tout sous-domaine -> IP du serveur.
address=/oeglobal.local/[% server_ip %]

# DNS amont : soit 'server=<routeur>' (forward Internet), soit 'no-resolv'
# (mode isolé : ne répond QUE oeglobal.local, ne suit pas le resolv.conf hôte).
[% upstream_dns_line %]

# Ne pas forwarder les noms sans domaine ni les adresses privées inversées non
# routables vers l'amont (réduit le bruit / les fuites DNS).
domain-needed
bogus-priv

# N'écouter que sur l'IP LAN du serveur (pas 127.0.0.53 de systemd-resolved) et
# sur la boucle locale (127.0.0.1, utile pour le healthcheck du conteneur).
listen-address=[% server_ip %]
listen-address=127.0.0.1
bind-interfaces

# Ne répondre qu'aux requêtes locales (pas un resolver ouvert sur Internet).
local-service
