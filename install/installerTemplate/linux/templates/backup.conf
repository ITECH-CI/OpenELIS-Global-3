# ================================================================
#  Configuration de la sauvegarde OpenELIS (DatabaseBackup.pl)
#  Éditez ce fichier puis attendez le prochain backup (ou relancez-le).
#  Lignes vides et commentaires (#) ignorés. Format : CLE=valeur
# ================================================================

# --- Copie sur un support externe (disque dur / clé USB) --------
# Si ce dossier existe (support monté), CHAQUE backup y est copié en plus.
# Exemple : /media/oeserver/USB0/Backup
# Laisser la valeur par défaut si vous n'utilisez pas de support externe
# (la copie est simplement ignorée si le dossier n'existe pas).
EXTERNAL_BACKUP_DIR=/media/USB0/Backup

# --- Envoi hors-site par FTP (optionnel) ------------------------
# Passer FTP_ENABLED à true et renseigner l'URL + identifiants pour
# envoyer les backups vers un serveur FTP distant.
# FTP_TARGET_URL doit finir par '/' (le nom du fichier est ajouté).
FTP_ENABLED=false
FTP_TARGET_URL=
FTP_USERNAME=
FTP_PASSWORD=
