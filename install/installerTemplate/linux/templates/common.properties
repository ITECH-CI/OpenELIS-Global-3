# Simplified TLS: no internal client keystore/truststore. Outgoing HTTPS (e.g.
# consolidated server) uses the JVM default trust store. See HttpClientConfig.
encryption.general.password=[% encryption_key %]

spring.datasource.driver=org.postgresql.Driver
spring.datasource.url= jdbc:postgresql://[% db_host %]:[% db_port %]/clinlims?currentSchema=clinlims
spring.datasource.username=clinlims
spring.datasource.password=[% db_password %]
spring.jpa.hibernate.ddl-auto=update

org.openelisglobal.fhirstore.uri=[% local_fhir_server_address %]

org.openelisglobal.remote.source.uri=[% remote_fhir_server_address %]
org.openelisglobal.remote.source.updateStatus=[% remote_source_update_status %]
org.openelisglobal.remote.source.identifier=[% fhir_identifier %]
# Relève des demandes électroniques : toutes les 60 s.
org.openelisglobal.remote.poll.frequency=60000
org.openelisglobal.task.useBasedOn=true

# Numéro CMU (= matricule CNAM = n° de sécurité sociale) et équivalences LOINC.
# Valeurs par défaut ci-dessous. Pour les changer sur une instance installée,
# les écrire dans secrets/extra.properties : ce fichier est conservé par les
# mises à jour (common.properties est régénéré) et prime sur celui-ci.
#org.openelisglobal.cmu.identifier.system=https://hie.ci/patient/cmu
#org.openelisglobal.cmu.identifier.system.compat=urn:oid:1.3.6.1.4.1.53864.1.3
#org.openelisglobal.cmu.format=^[0-9]{13}$
#org.openelisglobal.cmu.identifier.systems.accepted=https://hie.ci/patient/cmu,urn:oid:1.3.6.1.4.1.53864.1.3,urn:oid:1.3.6.1.4.1.53864.1.2
# Équivalences LOINC des demandes reçues (demandé=codé dans le laboratoire) :
#org.openelisglobal.loinc.equivalences=20447-9=25836-8

org.openelisglobal.fhir.subscriber=[% consolidated_server_address %]
org.openelisglobal.fhir.subscriber.resources=Task,Patient,ServiceRequest,DiagnosticReport,Observation,Specimen,Practitioner,Encounter,QuestionnaireResponse
