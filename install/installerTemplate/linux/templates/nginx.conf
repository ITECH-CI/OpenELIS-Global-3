worker_processes 1;

events { worker_connections 1024; }

http {

	server {
	    listen 80;
	    server_name _;
    	return 301 https://$host$request_uri;
	}

    server {
        listen [::]:443 ssl;
        listen 443 ssl default;
	    # 'default' sert tout Host ; server_name est cosmétique (oeglobal.lan en
	    # mode local, le domaine public en mode online), substitué à l'install.
	    server_name [% server_name %] localhost;

        ssl_certificate /etc/nginx/serverCerts/cert.crt;
		ssl_certificate_key /etc/nginx/serverCerts/cert.key;
		ssl_password_file /etc/nginx/private/key_pass;

        # Politique TLS : désactiver les protocoles obsolètes (TLS 1.0/1.1).
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        # En-têtes de sécurité (données de santé). HSTS omis en LAN (cert
        # auto-signé -> piège de cache navigateur) ; à ajouter en mode online.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;

        # Use Docker's embedded DNS (127.0.0.11) and resolve upstreams via
        # variables so nginx does NOT resolve them at startup. Without this,
        # nginx aborts with "host not found in upstream" if the backend/frontend
        # container is not yet resolvable when the proxy boots.
        resolver 127.0.0.11 valid=10s ipv6=off;

        location / {
            set $frontend_upstream http://frontend.openelis.org:80;
            proxy_pass $frontend_upstream;
            proxy_redirect     off;
        }

        # Rattrapages FHIR (OEToFhir, PatientToFhir, OrganizationToFhir) : traitement
        # SYNCHRONE qui dure de quelques minutes à plus d'une heure. Avec le délai
        # par défaut de nginx (60 s), le client recevait un 504 alors que le
        # traitement continuait côté OE. Suivi : /api/OpenELIS-Global/OEToFhir/info.
        location ~ ^/api/OpenELIS-Global/(OEToFhir|PatientToFhir|OrganizationToFhir)(/|$) {
            set $oe_backfill_upstream http://oe.openelis.org:8080;
            proxy_pass         $oe_backfill_upstream;
            proxy_redirect     off;
            proxy_read_timeout 7200s;
            proxy_send_timeout 7200s;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Host $server_name;
        }

        location /api/ {
            # With a variable in proxy_pass, nginx forwards the ORIGINAL request
            # URI unchanged (no rewrite), so the "/api/" prefix is preserved —
            # which is exactly what the Tomcat context (/api/OpenELIS-Global/)
            # expects. Do NOT append a path to the variable here.
            set $oe_upstream http://oe.openelis.org:8080;
            proxy_pass         $oe_upstream;
            proxy_redirect     off;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Host $server_name;
        }
        
        # ============================================================
        # Passerelle FHIR : exposition LECTURE du serveur FHIR (HAPI) aux tiers
        # (BDM, mini-HIE...). Chaque requête est validée par OE (jeton du client
        # de passerelle, ressource autorisée, lecture seule, audit) via
        # auth_request. Le HAPI n'est PAS publié sur l'hôte : seul ce proxy y donne
        # accès. Mêmes en-têtes que volume/nginx/nginx-prod.conf.
        # ============================================================

        # Sous-requête d'auth interne (200 / 401 / 403), non joignable de
        # l'extérieur. Variable + URI explicite : nginx envoie exactement cette URI.
        location = /fhir-gateway/auth {
            internal;
            set $oe_auth_upstream http://oe.openelis.org:8080;
            proxy_pass              $oe_auth_upstream/api/OpenELIS-Global/rest/fhir-gateway/auth;
            proxy_pass_request_body off;
            proxy_set_header        Content-Length "";
            proxy_set_header        Authorization $http_authorization;
            proxy_set_header        X-API-Key $http_x_api_key;
            # méthode et URI de la requête CLIENTE (pas de la sous-requête)
            proxy_set_header        X-Original-Method $request_method;
            proxy_set_header        X-Original-URI $request_uri;
        }

        # "/fhir" sans barre finale : c'est la forme des liens de pagination du HAPI
        # (/fhir?_getpages=...). Sans ce bloc, nginx répond 301 vers /fhir/.
        location = /fhir {
            auth_request        /fhir-gateway/auth;
            set $fhir_upstream http://fhir.openelis.org:8080;
            proxy_pass          $fhir_upstream;
            proxy_redirect      off;
            proxy_set_header    Host $host;
            proxy_set_header    X-Real-IP $remote_addr;
            proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Host $http_host;
            proxy_set_header    X-Forwarded-Proto $scheme;
        }

        location /fhir/ {
            # Allowlist IP par tiers autorisé (le jeton reste requis) :
            # allow 10.0.0.0/8;
            # deny all;
            auth_request        /fhir-gateway/auth;

            # Variable SANS chemin : nginx transmet l'URI d'origine telle quelle,
            # chaîne de requête comprise. Le préfixe public /fhir/ est aussi celui
            # du HAPI : /fhir/Patient?identifier=x arrive en /fhir/Patient?identifier=x.
            # HTTP 8080 sur le réseau docker privé (le 8443 du HAPI exige un
            # certificat client).
            set $fhir_upstream http://fhir.openelis.org:8080;
            proxy_pass          $fhir_upstream;
            proxy_redirect      off;
            proxy_set_header    Host $host;
            proxy_set_header    X-Real-IP $remote_addr;
            proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
            # hôte (port compris) et schéma publics, pour les liens de pagination du
            # HAPI (use_apache_address_strategy, sans server_address)
            proxy_set_header    X-Forwarded-Host $http_host;
            proxy_set_header    X-Forwarded-Proto $scheme;
        }

        # Réception PUSH d'ordres FHIR : vers OE (pas le HAPI), même contrôle.
        location /fhir-in/ {
            # allow 10.0.0.0/8; deny all;   # (mêmes tiers que /fhir/)
            auth_request        /fhir-gateway/auth;
            # "set" AVANT "rewrite ... break" : break arrête les directives de
            # réécriture suivantes, un set placé après ne serait pas exécuté (500).
            set $oe_upstream http://oe.openelis.org:8080;
            # préfixe public /fhir-in/ -> /api/OpenELIS-Global/rest/fhir-in/ ;
            # proxy_pass sans chemin : l'URI réécrite est transmise, chaîne de
            # requête comprise.
            rewrite ^/fhir-in/(.*)$ /api/OpenELIS-Global/rest/fhir-in/$1 break;
            proxy_pass          $oe_upstream;
            proxy_redirect      off;
            proxy_set_header    Host $host;
            proxy_set_header    X-Real-IP $remote_addr;
            proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /health {
            access_log off;
            add_header 'Content-Type' 'application/json';
            return 200 '{"status":"UP"}';
        }
    }

}