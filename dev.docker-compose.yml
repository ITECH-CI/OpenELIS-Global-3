version: '3.3'
services:
    certs:
        container_name: oe-certs 
        # certificats TLS internes PROPRES à l'installation (clé générée au 1er
        # démarrage par volume/certs/generate-certs.sh) ; l'ancienne image publique
        # itechuw/certgen embarquait la même clé privée pour tous. Conteneur
        # « one-shot » : génère si besoin puis s'arrête (Exited (0)).
        image: eclipse-temurin:21.0.13_9-jre
        entrypoint: ["/bin/bash", "/opt/oe-certs/generate-certs.sh"]
        restart: "no"
        environment:
            - KEYSTORE_PW="kspass"
            - TRUSTSTORE_PW="tspass"
            - CERT_CN=${OE_CERT_CN:-localhost}
            - CERT_SAN=${OE_CERT_SAN:-}
        networks:
            - default
        volumes:
            -  key_trust-store-volume:/etc/openelis-global
            -  keys-vol:/etc/ssl/private/
            -  certs-vol:/etc/ssl/certs/
            -  ./volume/certs/generate-certs.sh:/opt/oe-certs/generate-certs.sh:ro

    database:
        container_name: openelisglobal-database 
        image: postgres:14.25
        ports:
            - "15432:5432"
        restart: always
        env_file:
            - ./volume/database/database.env
        volumes:
              # preserves the database between containers
             - ./volume/database/data:/var/lib/postgresql/data                
              # files here will run on install
             - ./volume/database/dbInit:/docker-entrypoint-initdb.d
        networks:
            - default
        healthcheck:
            test: [ "CMD", "pg_isready", "-q", "-d", "clinlims", "-U", "clinlims" ]
            timeout: 45s
            interval: 10s
            retries: 10 
            
    oe.openelis.org:
        container_name: openelisglobal-webapp
        build:
            context: .
            dockerfile: Dockerfile.dev
        # image: itechuw/openelis-global-2-dev:develop
        platform: linux/amd64
        depends_on:
            database:
              condition: service_started
            certs:
              condition: service_completed_successfully
        ports:
            - "8080:8080"
            - "8443:8443"
        restart: always
        networks:
          default:
              ipv4_address: 172.20.1.121
        environment:
            - DEFAULT_PW=adminADMIN! 
            - TZ=Africa/Abidjan
              # context.xml doesn't seem to be able to pick up environment variables directly, so we are passing them in as CATALINA_OPTS
            - CATALINA_OPTS= -Ddatasource.url=jdbc:postgresql://database:5432/clinlims -Ddatasource.username=clinlims
        volumes:
            -  key_trust-store-volume:/etc/openelis-global
            - ./volume/plugins/:/var/lib/openelis-global/plugins
            - ./volume/logs/oeLogs:/var/lib/openelis-global/logs
            - ./volume/logs/tomcatLogs/:/usr/local/tomcat/logs
            - ./volume/tomcat/oe_server.xml:/usr/local/tomcat/conf/server.xml
            # - ./target/OpenELIS-Global.war:/usr/local/tomcat/webapps/OpenELIS-Global.war
            - ./volume/properties/SystemConfiguration.properties:/var/lib/openelis-global/properties/SystemConfiguration.properties
            - ./volume/odoo/odoo-test-product-mapping.csv:/var/lib/openelis-global/odoo/odoo-test-product-mapping.csv
            -  lucene_index-vol:/var/lib/lucene_index
            - ./volume/analyzer/analyzer-test-map.csv:/var/lib/openelis-global/analyzer/analyzer-test-map.csv
            - ./volume/ocl:/var/lib/openelis-global/ocl
        secrets:
            - source: datasource.password
            - source: common.properties
            
    fhir.openelis.org:
        container_name: external-fhir-api
        image: itechuw/openelis-global-2-fhir@sha256:4bc0052c225870090397d65e73880c045cf493c47bcff264851380587cc0c837 # develop du 21/04/2025
        platform: linux/amd64
        depends_on:
            database:
              condition: service_started
            certs:
              condition: service_completed_successfully
        ports:
            - "8081:8080"
            - "8444:8443"
        networks:
            - default
        restart: always
        environment:
          SPRING_CONFIG_LOCATION: file:///run/secrets/hapi_application.yaml
          TZ: Africa/Abidjan

          JAVA_OPTS: "-Djavax.net.ssl.trustStore=/etc/openelis-global/truststore 
                      -Djavax.net.ssl.trustStorePassword=tspass
                      -Djavax.net.ssl.trustStoreType=pkcs12 
                      -Djavax.net.ssl.keyStore=/etc/openelis-global/keystore 
                      -Djavax.net.ssl.keyStorePassword=kspass 
                      -Djavax.net.ssl.keyStoreType=pkcs12"            
        
        volumes:
            -  key_trust-store-volume:/etc/openelis-global
            - ./volume/tomcat/hapi_server.xml:/opt/bitnami/tomcat/conf/server.xml
        secrets:
             - source: hapi_application.yaml 

         
    frontend.openelis.org:
        # Serveur de développement Vite (étape dev de frontend/Dockerfile),
        # en HTTP sur le port 80 derrière le mandataire ; les sources sont
        # montées pour le rechargement à chaud.
        build:
            context: ./frontend
            target: dev
        image: openelis-civ-frontend-dev
        container_name: openelisglobal-front-end
        networks:
            - default
        volumes:
            - './frontend/src:/app/src'
            - './frontend/public:/app/public'
            - './frontend/index.html:/app/index.html'
        environment:
            - CHOKIDAR_USEPOLLING=true
            - VITE_HMR_CLIENT_PORT=443
        tty: true

    proxy:
        image: itechuw/openelis-global-2-proxy@sha256:121949992223c43621df30c179168f7d22396bb3f23849030dbec4fdb7e2982d # develop du 21/04/2025
        container_name: openelisglobal-proxy
        platform: linux/amd64
        ports:
            - 80:80
            - 443:443
        volumes:
            - certs-vol:/etc/nginx/certs/
            - keys-vol:/etc/nginx/keys/
            - ./volume/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
        networks:
            - default
        restart: unless-stopped
        depends_on:
            certs:
              condition: service_completed_successfully
            
secrets:
  datasource.password:
    file: ./volume/properties/datasource.password  
  common.properties:
    file:  ./volume/properties/common.properties  
  hapi_application.yaml:
    file: ./volume/properties/hapi_application.yaml    

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.1.0/24  
        
volumes:
  db-data:
  key_trust-store-volume:
  certs-vol:
  keys-vol:
  lucene_index-vol: