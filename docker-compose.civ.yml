# docker-compose.civ.yml — déploiement / mise à jour EN LIGNE du fork CIV.
#
# Les 4 images CIV (backend, frontend, fhir, nginx) sont tirées depuis ghcr.io ;
# postgres et certs restent tiers/upstream. Pour les sites SANS connexion, utiliser
# plutôt l'installeur offline (.tar.gz de la GitHub Release), pas ce fichier.
#
# Usage :
#   OE_TAG=3.3.1.0 docker compose -f docker-compose.civ.yml pull
#   OE_TAG=3.3.1.0 docker compose -f docker-compose.civ.yml up -d
#   (OE_TAG par défaut = latest)
#
# NB : les montages ./volume/* et les secrets doivent exister sur le serveur
# (fournis par l'installeur ou une install existante). Ce compose ne recrée pas
# la configuration, il ne fait que déployer les images CIV.
version: "3.3"
services:
  certs:
    container_name: oe-certs
    image: itechuw/certgen:main
    platform: linux/amd64
    restart: always
    environment:
      - KEYSTORE_PW="kspass"
      - TRUSTSTORE_PW="tspass"
    networks:
      - default
    volumes:
      - key_trust-store-volume:/etc/openelis-global
      - keys-vol:/etc/ssl/private/
      - certs-vol:/etc/ssl/certs/

  database:
    container_name: openelisglobal-database
    image: postgres:14.4
    ports:
      - "15432:5432"
    restart: always
    env_file:
      - ./volume/database/database.env
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./volume/database/dbInit:/docker-entrypoint-initdb.d
    networks:
      - default
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "clinlims", "-U", "clinlims"]
      timeout: 45s
      interval: 10s
      retries: 10

  oe.openelis.org:
    container_name: openelisglobal-webapp
    image: ghcr.io/itech-ci/openelis-global-civ:${OE_TAG:-latest}
    platform: linux/amd64
    depends_on:
      - database
      - certs
    ports:
      - "8080:8080"
      - "8443:8443"
    restart: always
    networks:
      default:
        ipv4_address: 172.20.1.121
    environment:
      - DEFAULT_PW=adminADMIN!
      - TZ=Africa/Abidjan
      - CATALINA_OPTS= -Ddatasource.url=jdbc:postgresql://database:5432/clinlims -Ddatasource.username=clinlims
    volumes:
      - key_trust-store-volume:/etc/openelis-global
      - ./volume/plugins/:/var/lib/openelis-global/plugins
      - ./volume/tomcat/oe_server.xml:/usr/local/tomcat/conf/server.xml
      - lucene_index-vol:/var/lib/lucene_index
      - ./volume/test-map/test-loinc-map.csv:/var/lib/openelis-global/plugin-test-mappings/test-loinc-map.csv
      - ./volume/properties/SystemConfiguration.properties:/var/lib/openelis-global/properties/SystemConfiguration.properties
      - ./volume/odoo/odoo-test-product-mapping.csv:/var/lib/openelis-global/odoo/odoo-test-product-mapping.csv
    secrets:
      - source: datasource.password
      - source: common.properties

  fhir.openelis.org:
    container_name: external-fhir-api
    image: ghcr.io/itech-ci/openelis-global-civ-fhir:${OE_TAG:-latest}
    platform: linux/amd64
    depends_on:
      - database
      - certs
    ports:
      - "8081:8080"
      - "8444:8443"
    networks:
      - default
    restart: always
    environment:
      SPRING_CONFIG_LOCATION: file:///run/secrets/hapi_application.yaml
      TZ: Africa/Abidjan
      JAVA_OPTS: "-Djavax.net.ssl.trustStore=/etc/openelis-global/truststore
        -Djavax.net.ssl.trustStorePassword=tspass
        -Djavax.net.ssl.trustStoreType=pkcs12
        -Djavax.net.ssl.keyStore=/etc/openelis-global/keystore
        -Djavax.net.ssl.keyStorePassword=kspass
        -Djavax.net.ssl.keyStoreType=pkcs12"
    volumes:
      - key_trust-store-volume:/etc/openelis-global
      - ./volume/tomcat/hapi_server.xml:/opt/bitnami/tomcat/conf/server.xml
    secrets:
      - source: hapi_application.yaml

  frontend.openelis.org:
    image: ghcr.io/itech-ci/openelis-global-civ-frontend:${OE_TAG:-latest}
    container_name: openelisglobal-front-end
    platform: linux/amd64
    networks:
      - default
    environment:
      - CHOKIDAR_USEPOLLING=true
    tty: true

  proxy:
    container_name: openelisglobal-proxy
    image: ghcr.io/itech-ci/openelis-global-civ-nginx:${OE_TAG:-latest}
    platform: linux/amd64
    ports:
      - 80:80
      - 443:443
    volumes:
      - certs-vol:/etc/nginx/certs/
      - keys-vol:/etc/nginx/keys/
      - ./volume/nginx/nginx-prod.conf:/etc/nginx/nginx.conf:ro
    networks:
      - default
    restart: unless-stopped
    depends_on:
      - certs

secrets:
  datasource.password:
    file: ./volume/properties/datasource.password
  common.properties:
    file: ./volume/properties/common.properties
  hapi_application.yaml:
    file: ./volume/properties/hapi_application.yaml

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.1.0/24

volumes:
  db-data:
  key_trust-store-volume:
  certs-vol:
  keys-vol:
  lucene_index-vol:
